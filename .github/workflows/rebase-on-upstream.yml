# Keep this fork's branch sitting directly on top of postmarketOS upstream.
#
# Upstream lives on GitLab, not GitHub, so there is no fork relationship to
# lean on: the job adds the GitLab remote by hand, rebases, and force-pushes.
# A rebase rewrites the branch, hence --force-with-lease rather than --force.
name: Rebase on upstream

on:
  schedule:
    # 04:17 UTC. Off the hour on purpose: the top of the hour is heavily
    # contended on GitHub's shared runners and scheduled jobs get delayed.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never let two rebases race each other onto the same branch.
concurrency:
  group: rebase-on-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
  UPSTREAM_BRANCH: main
  BRANCH: rpi-zero-w-alpine-only

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpi-zero-w-alpine-only
          # A rebase needs real history; the default depth of 1 cannot do it.
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      # The fork's own main is otherwise never written to, so it stays frozen at
      # whatever upstream looked like on the day the fork was made. Nothing in
      # this pipeline reads it - the rebase above uses the GitLab remote directly
      # and alpine-pi builds from this branch - but pmbootstrap resolves
      # channels.cfg out of pmaports' main, so a stale copy hands anyone working
      # from this fork an out-of-date channel-to-branch map.
      #
      # Plain --force, not --force-with-lease: this ref is a pure mirror, nothing
      # is ever committed to it, and a lease would only fail the job whenever
      # upstream rewrote its own history.
      - name: Mirror upstream main onto the fork's main
        run: |
          git push --force origin \
            "refs/remotes/upstream/$UPSTREAM_BRANCH:refs/heads/$UPSTREAM_BRANCH"

      - name: Rebase
        id: rebase
        run: |
          before=$(git rev-parse HEAD)
          base=$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH")
          head=$(git rev-parse "upstream/$UPSTREAM_BRANCH")

          if [ "$base" = "$head" ]; then
            echo "Already on top of upstream/$UPSTREAM_BRANCH ($(git rev-parse --short HEAD))."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Rebasing $(git rev-list --count "$base"..HEAD) commit(s) onto $(git rev-parse --short "$head")."
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            # Leave the branch exactly as it was. The issue step reports it.
            git rebase --abort || true
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.rebase.outputs.changed == 'true'
        run: |
          git push --force-with-lease="$BRANCH:${{ steps.rebase.outputs.before }}" \
            origin "HEAD:$BRANCH"

      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "rebase-failure";
            const branch = process.env.BRANCH;
            const upstream = `upstream/${process.env.UPSTREAM_BRANCH}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;

            const body = [
              `Rebasing \`${branch}\` onto \`${upstream}\` failed.`,
              "",
              `Run: ${run}`,
              "",
              "The branch was **not** modified — \`git rebase --abort\` ran and nothing " +
                "was pushed, so the fork is still in its last good state.",
              "",
              "Usually this is a conflict with an upstream change. To sort it out locally:",
              "",
              "\`\`\`sh",
              `git remote add upstream ${process.env.UPSTREAM_URL}`,
              `git fetch upstream ${process.env.UPSTREAM_BRANCH}`,
              `git switch ${branch}`,
              `git rebase ${upstream}`,
              "# resolve, git add, git rebase --continue, then:",
              `git push --force-with-lease origin ${branch}`,
              "\`\`\`",
              "",
              "This issue is reused for later failures; close it once the rebase succeeds.",
            ].join("\n");

            // Creating the label up front keeps the search below meaningful.
            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "b60205",
                description: "The daily upstream rebase failed",
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 => already exists
            }

            // One issue, commented on repeatedly, instead of a new one every day.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label, per_page: 1,
            });

            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `Daily rebase onto ${upstream} failed`,
                body,
                labels: [label],
              });
            }
